# CI oficial fora do GitHub Actions (Woodpecker self-hosted — ver
# infra/woodpecker/ no repositório ejc). Portões do CLAUDE.md + sintaxe dos
# scripts operacionais que não passam pelo TypeScript.
when:
  - event: push
    branch: main
  - event: pull_request

steps:
  gates:
    image: node:22
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - bash -n scripts/deploy-free.sh scripts/backup-db-cron.sh scripts/backup-uploads.sh
      - node --check scripts/backup-db.mjs
      - pnpm check
      - pnpm test
      - pnpm build
