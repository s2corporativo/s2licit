# Deploy do Sistema S2 (app + MySQL) para VPS.
# Segredos vêm de .env. O proxy reverso (Caddy) é o único ponto público.

services:
  db:
    image: mysql:8.0
    container_name: sistema-s2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_s2}
      MYSQL_USER: ${MYSQL_USER:-s2user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}

  app:
    image: ${S2_IMAGE:-sistema-s2-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-s2-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      FORCE_SECURE_COOKIES: "true"
      DATABASE_URL: mysql://${MYSQL_USER:-s2user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sistema_s2}
      BACKUP_DIR: /app/backups
      # Relatórios automáticos por e-mail foram removidos da operação normal.
      DAILY_REPORT_ENABLED: "false"
      QUOTATION_AUTO_SEND_ENABLED: "false"
      # Segurança de equivalência: nome sozinho não auto-confirma.
      QUOTATION_AUTO_CONFIRM_THRESHOLD: ${QUOTATION_AUTO_CONFIRM_THRESHOLD:-1}
      # Custos padrão entram na fórmula se o fluxo não fornecer valores específicos.
      PRICING_DEFAULT_TAX_PERCENT: ${PRICING_DEFAULT_TAX_PERCENT:-0}
      PRICING_DEFAULT_FREIGHT_UNIT: ${PRICING_DEFAULT_FREIGHT_UNIT:-0}
      MIGRATION_STRICT: ${MIGRATION_STRICT:-true}
      SCHEMA_BOOT_DDL_ENABLED: ${SCHEMA_BOOT_DDL_ENABLED:-false}
    ports:
      # Somente loopback: Caddy/healthcheck local acessam o app; Internet não.
      - "127.0.0.1:${APP_LOCAL_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    mem_limit: ${APP_MEM_LIMIT:-2g}

volumes:
  mysql_data:
  uploads_data:
  backups_data:
