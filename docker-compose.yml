version: "3.9"

# Deploy do Sistema S2 (app + MySQL) para VPS.
# Os segredos vêm de um arquivo .env ao lado deste (veja .env.production.example).
# Suba com:  docker compose up -d --build

services:
  db:
    image: mysql:8.0
    container_name: sistema-s2-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sistema_s2}
      MYSQL_USER: ${MYSQL_USER:-s2user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Porta exposta só localmente (127.0.0.1); o app acessa via rede interna.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-s2-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-s2user}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sistema_s2}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
