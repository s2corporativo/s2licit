services:
- type: web
  name: s2-licitacoes
  runtime: docker
  plan: starter
  autoDeploy: true
  healthCheckPath: /healthz
  dockerfilePath: ./render.Dockerfile
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 3000
  - key: DATABASE_URL
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: ENCRYPTION_KEY
    sync: false
  # Administrador inicial (login local) — criado no primeiro boot
  - key: ADMIN_EMAIL
    sync: false
  - key: ADMIN_PASSWORD
    sync: false
  # IA (enriquecimento, classificação, agentes)
  - key: AI_PROVIDER
    value: auto
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-sonnet-5
  - key: GROQ_API_KEY
    sync: false
  - key: GROQ_MODEL
    value: llama-3.3-70b-versatile
  # Ingestão de cotações por e-mail (IMAP) — sincronização automática
  - key: IMAP_HOST
    sync: false
  - key: IMAP_PORT
    value: "993"
  - key: IMAP_USER
    sync: false
  - key: IMAP_PASSWORD
    sync: false
  # Envio de e-mail (SMTP) — responder cotações
  - key: SMTP_HOST
    sync: false
  - key: SMTP_PORT
    value: "587"
  - key: SMTP_USER
    sync: false
  - key: SMTP_PASSWORD
    sync: false
  - key: SMTP_FROM
    sync: false
  # WhatsApp para alertas diários (opcional)
  - key: WHATSAPP_PHONE_ID
    sync: false
  - key: WHATSAPP_TOKEN
    sync: false
  - key: WHATSAPP_API_VERSION
    value: v21.0
  - key: WHATSAPP_WEBHOOK_URL
    sync: false
  - key: WHATSAPP_TO
    sync: false
  # Integração opcional Compras MG (Prodemge)
  - key: PRODEMGE_API_KEY
    sync: false
  # OAuth externo (opcional/legado) — deixe vazio para usar login local
  - key: OAUTH_SERVER_URL
    sync: false
  - key: OWNER_OPEN_ID
    sync: false
  - key: PUPPETEER_EXECUTABLE_PATH
    value: /usr/bin/chromium
