services:
- type: web
  name: s2-licitacoes
  runtime: docker
  plan: starter
  autoDeploy: true
  healthCheckPath: /healthz
  dockerfilePath: ./render.Dockerfile
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 3000
  - key: DATABASE_URL
    sync: false
  - key: JWT_SECRET
    sync: false
  - key: ENCRYPTION_KEY
    sync: false
  # Administrador inicial (login local) — criado no primeiro boot
  - key: ADMIN_EMAIL
    sync: false
  - key: ADMIN_PASSWORD
    sync: false
  # IA (enriquecimento, classificação, agentes)
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-sonnet-5
  # Integração opcional Compras MG (Prodemge)
  - key: PRODEMGE_API_KEY
    sync: false
  # OAuth externo (opcional/legado) — deixe vazio para usar login local
  - key: OAUTH_SERVER_URL
    sync: false
  - key: OWNER_OPEN_ID
    sync: false
  - key: PUPPETEER_EXECUTABLE_PATH
    value: /usr/bin/chromium
