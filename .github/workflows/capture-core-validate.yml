name: Capture Core validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile.validate"
      - ".github/workflows/capture-core-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capture-core-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Validate application
        run: docker build --target quality --file Dockerfile.validate .
