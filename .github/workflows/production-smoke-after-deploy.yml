name: Homologação pós-deploy

on:
  workflow_run:
    workflows: ["Deploy VPS"]
    types: [completed]

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: production-homologation
  cancel-in-progress: true

env:
  SMOKE_BASE_URL: ${{ vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}
  SMOKE_ROUTES: ${{ vars.SMOKE_ROUTES || '/,/cotacoes-recebidas,/produtos,/fornecedores,/propostas,/radar-pncp,/funil' }}
  SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
  SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
  SMOKE_MFA_TOKEN: ${{ secrets.SMOKE_MFA_TOKEN }}
  SMOKE_SCREENSHOT_DIR: artifacts/smoke

jobs:
  deploy-failed:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Registrar falha do deploy no commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'failure',
              context: 'production-smoke',
              description: 'Deploy de produção falhou antes da homologação',
              target_url: context.payload.workflow_run.html_url,
            });

  smoke:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, X64, s2licit, contabo]
    timeout-minutes: 20
    steps:
      - name: Marcar homologação em andamento
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.workflow_run.head_sha,
              state: 'pending',
              context: 'production-smoke',
              description: 'Executando smoke autenticado após deploy',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout da versão publicada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Localizar ou instalar navegador
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "PUPPETEER_EXECUTABLE_PATH=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          export DEBIAN_FRONTEND=noninteractive
          if command -v apt-get >/dev/null; then
            apt-get update -q
            apt-get install -y -q chromium >/dev/null 2>&1 || apt-get install -y -q chromium-browser >/dev/null 2>&1
          fi
          if [ -x /usr/bin/chromium ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium" >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium-browser ]; then
            echo "PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser" >> "$GITHUB_ENV"
          else
            echo "Nenhum Chrome/Chromium disponível" >&2
            exit 1
          fi

      - name: Validar conta de smoke
        run: |
          if [ -z "$SMOKE_USER_EMAIL" ] || [ -z "$SMOKE_USER_PASSWORD" ]; then
            echo "::error::Configure SMOKE_USER_EMAIL e SMOKE_USER_PASSWORD."
            exit 1
          fi

      - name: Executar smoke autenticado
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Registrar resultado da homologação no commit
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        with:
          script: |
            const passed = process.env.SMOKE_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.workflow_run.head_sha,
              state: passed ? 'success' : 'failure',
              context: 'production-smoke',
              description: passed ? 'Produção homologada pelo smoke autenticado' : 'Smoke autenticado de produção falhou',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Abrir ou atualizar incidente quando falhar
        if: always() && steps.smoke.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Smoke de produção do S2 Licit falhou';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const incident = issues.find(i => !i.pull_request && i.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `A homologação automática pós-deploy falhou.\n\n- Commit: ${context.payload.workflow_run.head_sha}\n- Deploy: ${context.payload.workflow_run.html_url}\n- Smoke/evidências: ${runUrl}`;
            if (incident) await github.rest.issues.createComment({ owner, repo, issue_number: incident.number, body });
            else await github.rest.issues.create({ owner, repo, title, body });

      - name: Falhar quando o smoke falhar
        if: steps.smoke.outcome != 'success'
        run: exit 1
