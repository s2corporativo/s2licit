name: Apply Puppeteer 25 source migration

on:
  push:
    branches:
      - agent/auditoria-correcao-3-31
    paths:
      - scripts/migrate-puppeteer25-click-options.mjs

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auditoria-correcao-3-31
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar migração de ClickOptions
        run: node scripts/migrate-puppeteer25-click-options.mjs
      - name: Persistir código migrado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/services/propostaAgent.ts
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git commit -m 'Migra ClickOptions para Puppeteer 25'
          git push origin HEAD:agent/auditoria-correcao-3-31
