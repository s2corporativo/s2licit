name: Puppeteer 25 compatibility PR143

on:
  push:
    branches: [agent/selective-hardening-127]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-puppeteer-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selective-hardening-127
      - name: Atualizar opção removida no Puppeteer 25
        run: |
          set -euo pipefail
          sed -i 's/clickCount:/count:/g' server/services/propostaAgent.ts
          if grep -n 'clickCount:' server/services/propostaAgent.ts; then
            echo 'Ainda existe clickCount no agente.' >&2
            exit 1
          fi
          if git diff --quiet -- server/services/propostaAgent.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/propostaAgent.ts
          git commit -m "fix: adaptar cliques ao Puppeteer 25 [skip-puppeteer-fix]"
          git push origin HEAD:agent/selective-hardening-127
