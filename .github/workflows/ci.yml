name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Verificação de tipos (tsc)
        id: typecheck
        continue-on-error: true
        run: pnpm exec tsc --noEmit --pretty false > typecheck.log 2>&1

      - name: Publicar diagnóstico do TypeScript
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck.log
          retention-days: 3

      - name: Interromper em erro de tipos
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Testes (vitest)
        run: pnpm test

      - name: Build de produção
        run: pnpm build
