name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - name: Checkout branch da PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerar lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Persistir lockfile atualizado
        id: lock
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then echo 'changed=false' >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Atualiza lockfile após ajuste do brace-expansion'
          git push origin HEAD:${{ github.head_ref }}
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  validate:
    needs: refresh-lockfile
    if: needs.refresh-lockfile.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-audit-fixes.mjs
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
