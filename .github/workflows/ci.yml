name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gate estático da auditoria
        run: node scripts/validate-audit-fixes.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build
