name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bloquear secrets e arquivos sensíveis
        run: node scripts/security-scan.mjs

      - name: Gerar auditoria estrutural
        run: node scripts/repository-audit.mjs > repository-audit.json

      - name: Publicar auditoria estrutural
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: repository-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Verificação de tipos (tsc)
        id: typecheck
        continue-on-error: true
        run: pnpm exec tsc --noEmit --pretty false > typecheck.log 2>&1

      - name: Publicar diagnóstico do TypeScript
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck.log
          retention-days: 3

      - name: Interromper em erro de tipos
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Testes (vitest)
        id: tests
        continue-on-error: true
        run: pnpm test -- --reporter=verbose > tests.log 2>&1

      - name: Publicar diagnóstico dos testes
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-errors
          path: tests.log
          retention-days: 3

      - name: Interromper em falha de testes
        if: steps.tests.outcome == 'failure'
        run: |
          tail -n 250 tests.log
          exit 1

      - name: Build de produção
        run: pnpm build

  mysql-migrations:
    # Exercita as migrações contra um MySQL real e valida idempotência.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: s2licit_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/s2licit_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Aguardar MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL pronto"; exit 0
            fi
            sleep 2
          done
          echo "MySQL não respondeu a tempo" >&2; exit 1

      - name: Aplicar migrações de produção do zero
        id: migrations
        continue-on-error: true
        run: node scripts/migrate-production.mjs > migration.log 2>&1

      - name: Publicar diagnóstico das migrações
        if: steps.migrations.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: migration-errors
          path: migration.log
          retention-days: 3

      - name: Interromper em falha de migração
        if: steps.migrations.outcome == 'failure'
        run: |
          tail -n 300 migration.log
          exit 1

      - name: Reaplicar migrations (idempotência)
        run: node scripts/migrate-production.mjs

      - name: Testes de integração contra MySQL real
        run: pnpm exec vitest run server/**/*.integration-db.test.ts --passWithNoTests

  docker-image:
    # Só consome runner após código, testes e migrations serem aprovados.
    needs: [build-and-test, mysql-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build da imagem Docker
        run: docker build -t s2licit-ci-check .
