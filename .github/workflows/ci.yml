name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Verificação de tipos (tsc)
        id: typecheck
        continue-on-error: true
        run: pnpm exec tsc --noEmit --pretty false > typecheck.log 2>&1

      - name: Publicar diagnóstico do TypeScript
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck.log
          retention-days: 3

      - name: Interromper em erro de tipos
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Testes (vitest)
        id: tests
        continue-on-error: true
        run: pnpm test -- --reporter=verbose > tests.log 2>&1

      - name: Publicar diagnóstico dos testes
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-errors
          path: tests.log
          retention-days: 3

      - name: Interromper em falha de testes
        if: steps.tests.outcome == 'failure'
        run: |
          tail -n 250 tests.log
          exit 1

      - name: Build de produção
        run: pnpm build

  diagnostico-vps:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/vps-502-diagnostico-20260715'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preparar SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Diagnosticar VPS sem expor segredos
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SSHPASS:-}" ]; then
            echo "::error::Secret VPS_PASSWORD ausente"
            exit 1
          fi
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          sshpass -e ssh $SSH_OPTS root@13.140.167.153 'bash -s' <<'REMOTE' | tee vps-diagnostico.txt
          set +e
          redact() {
            sed -E 's/(password|passwd|token|secret|authorization|api[_-]?key)([=: ]+)[^ ,;]+/\1\2[REDACTED]/Ig'
          }

          echo "=== IDENTIDADE E RECURSOS ==="
          hostname
          date -Is
          uptime
          df -h / /var/lib/docker 2>/dev/null || true
          free -m || true

          echo "=== DIRETÓRIO DO SISTEMA ==="
          cd /opt/s2licit || { echo "ERRO: /opt/s2licit inexistente"; exit 2; }
          pwd
          test -f .env && echo ".env presente" || echo "ERRO: .env ausente"
          grep -E '^(DOMAIN|APP_HTTP_PORT|APP_LOCAL_PORT|NODE_ENV|AI_PROVIDER|EMAIL_SYNC_ENABLED|ALERTS_ENABLED|SCRAPER_SCHEDULE_ENABLED)=' .env 2>/dev/null || true

          echo "=== DOCKER COMPOSE ==="
          docker compose ps -a || true
          for container in sistema-s2-app sistema-s2-db; do
            echo "--- ${container} ---"
            docker inspect --format 'status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$container" 2>&1 || true
          done

          echo "=== ARQUIVOS DE MIGRAÇÃO ==="
          ls -la drizzle/*.sql drizzle/meta/_journal.json 2>&1 || true
          sha256sum drizzle/*.sql 2>&1 || true
          cat drizzle/meta/_journal.json 2>&1 || true

          echo "=== ESTADO DAS MIGRAÇÕES NO MYSQL ==="
          docker exec sistema-s2-db sh -lc 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -D"$MYSQL_DATABASE" --batch --raw -e "
            SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN (\"__drizzle_migrations\",\"duplicate_exceptions\");
            SELECT COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=\"products\" AND COLUMN_NAME IN (\"viaAdministracao\",\"validadeMeses\");
            SELECT COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME=\"scraper_configs\" AND COLUMN_NAME=\"customSelectors\";
            SELECT id, hash, created_at FROM __drizzle_migrations ORDER BY created_at;
          "' 2>&1 | redact || true

          echo "=== EXECUÇÃO FOREGROUND DA MIGRAÇÃO ==="
          docker compose run --rm --no-deps -e CI=1 -e NO_COLOR=1 -e TERM=dumb app sh -lc 'pnpm exec drizzle-kit migrate' 2>&1 | redact || true

          echo "=== LOGS APP/DB (REDACTADOS) ==="
          docker compose logs --tail=250 app db 2>&1 | redact || true

          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env 2>/dev/null | head -1 | cut -d= -f2)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          echo "=== TESTE LOCAL :${LOCAL_PORT} ==="
          curl -sS -i --max-time 8 "http://127.0.0.1:${LOCAL_PORT}/healthz" 2>&1 || true
          echo
          curl -sS -i --max-time 8 "http://127.0.0.1:${LOCAL_PORT}/readyz" 2>&1 || true
          echo

          echo "=== PORTAS ==="
          ss -ltnp 2>/dev/null | grep -E ":(80|443|${LOCAL_PORT})\\b" || true

          echo "=== NGINX ==="
          nginx -t 2>&1 || true
          systemctl is-active nginx || true
          grep -R -n -E 'server_name[[:space:]]+s2\.s2corporativo\.com\.br|proxy_pass' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          systemctl status nginx --no-pager -n 30 2>&1 | redact || true
          REMOTE

      - name: Publicar diagnóstico completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-diagnostico
          path: vps-diagnostico.txt
          retention-days: 1
