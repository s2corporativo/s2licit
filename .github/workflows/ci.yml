name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64, s2licit-vps]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Bloquear secrets e arquivos sensíveis
        run: node scripts/security-scan.mjs

      - name: Gerar auditoria estrutural no log
        run: node scripts/repository-audit.mjs | tee repository-audit.json

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Verificação de tipos
        run: |
          set -o pipefail
          pnpm exec tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: |
          set -o pipefail
          pnpm test -- --reporter=verbose 2>&1 | tee tests.log

      - name: Build de produção
        run: pnpm build

      - name: Limpar relatórios locais
        if: always()
        run: rm -f repository-audit.json typecheck.log tests.log

  mysql-migrations:
    runs-on: [self-hosted, linux, x64, s2licit-vps]
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: s2licit_ci
        ports:
          - 33060:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:33060/s2licit_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Aguardar MySQL de CI
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 33060 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL de CI pronto"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL de CI não respondeu a tempo" >&2
          exit 1

      - name: Aplicar migrações de produção do zero
        run: |
          set -o pipefail
          node scripts/migrate-production.mjs 2>&1 | tee migration.log

      - name: Reaplicar migrations para validar idempotência
        run: node scripts/migrate-production.mjs

      - name: Testes de integração contra MySQL real
        run: pnpm exec vitest run server/**/*.integration-db.test.ts --passWithNoTests

      - name: Limpar relatório local
        if: always()
        run: rm -f migration.log

  docker-image:
    needs: [build-and-test, mysql-migrations]
    runs-on: [self-hosted, linux, x64, s2licit-vps]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build da imagem Docker
        run: docker build -t "s2licit-ci-check:${{ github.sha }}" .

      - name: Remover imagem temporária
        if: always()
        run: docker image rm -f "s2licit-ci-check:${{ github.sha }}" >/dev/null 2>&1 || true
