name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Verificação de tipos (tsc)
        id: typecheck
        continue-on-error: true
        run: pnpm exec tsc --noEmit --pretty false > typecheck.log 2>&1

      - name: Publicar diagnóstico do TypeScript
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck.log
          retention-days: 3

      - name: Interromper em erro de tipos
        if: steps.typecheck.outcome == 'failure'
        run: |
          cat typecheck.log
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Testes (vitest)
        id: tests
        continue-on-error: true
        run: pnpm test -- --reporter=verbose > tests.log 2>&1

      - name: Publicar diagnóstico dos testes
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-errors
          path: tests.log
          retention-days: 3

      - name: Interromper em falha de testes
        if: steps.tests.outcome == 'failure'
        run: |
          tail -n 250 tests.log
          exit 1

      - name: Build de produção
        run: pnpm build

  verificar-vps:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify/vps-restaurada-20260715'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar SSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Capturar falha completa da aplicação
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}" || { echo "::error::Secret VPS_PASSWORD ausente"; exit 1; }
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          sshpass -e ssh $SSH_OPTS root@13.140.167.153 'bash -s' <<'REMOTE' | tee verificacao-vps.txt
          set +e
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | head -1 | cut -d= -f2)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          redact() {
            sed -E 's/(password|passwd|token|secret|authorization|api[_-]?key)([=: ]+)[^ ,;]+/\1\2[REDACTED]/Ig'
          }

          echo "=== CONTAINERS ==="
          docker compose ps -a 2>&1
          docker inspect --format 'app status={{.State.Status}} running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' sistema-s2-app 2>&1
          docker inspect --format 'image={{.Image}} path={{.Path}} args={{json .Args}}' sistema-s2-app 2>&1

          echo "=== LOGS COMPLETOS DO APP ==="
          docker compose logs --tail=300 app 2>&1 | redact

          echo "=== MIGRACOES REGISTRADAS ==="
          docker exec sistema-s2-db sh -lc 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -D"$MYSQL_DATABASE" --batch --skip-column-names -e "SELECT COUNT(*) FROM __drizzle_migrations; SELECT id, LEFT(hash,12), created_at FROM __drizzle_migrations ORDER BY id;"' 2>&1 | redact

          echo "=== TESTE DO MIGRADOR EM CONTAINER ISOLADO ==="
          docker compose run --rm --no-deps -e NO_COLOR=1 -e TERM=dumb app node scripts/migrate-production.mjs 2>&1 | redact

          echo "=== ENDPOINTS ==="
          curl -sS -i --max-time 8 "http://127.0.0.1:${LOCAL_PORT}/healthz" 2>&1
          curl -sS -i --max-time 8 "http://127.0.0.1:${LOCAL_PORT}/readyz" 2>&1
          curl -sS -I --max-time 12 https://s2.s2corporativo.com.br/ 2>&1
          REMOTE

      - name: Publicar verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao-vps
          path: verificacao-vps.txt
          retention-days: 1
