name: Agent patch products P0
on:
  push:
    branches: [agent/finalize-products-p0-107]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-products-p0-107
      - name: Aplicar patches controlados
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 match, encontrado {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "server/routers.ts",
              'import { productsRouter } from "./routers/productsGroup";\n',
              'import { productsRouter } from "./routers/productsGroup";\nimport { productBulkRouter } from "./routers/productBulk";\n',
          )
          replace_once(
              "server/routers.ts",
              '  products: productsRouter,\n',
              '  products: productsRouter,\n  productBulk: productBulkRouter,\n',
          )

          replace_once(
              "server/routers/productsGroup.ts",
              'import { protectedProcedure, router } from "../_core/trpc";',
              'import { editorProcedure, protectedProcedure, router } from "../_core/trpc";',
          )
          for name in ["bulkUpdate", "bulkArchive", "bulkReactivate", "bulkResolveDuplicates"]:
              replace_once(
                  "server/routers/productsGroup.ts",
                  f"    {name}: protectedProcedure",
                  f"    {name}: editorProcedure",
              )

          replace_once(
              "client/src/pages/ProdutosModern.tsx",
              'import { Link } from "wouter";\n',
              'import { Link } from "wouter";\nimport BulkProductActions from "@/components/products/BulkProductActions";\n',
          )
          replace_once(
              "client/src/pages/ProdutosModern.tsx",
              '  const [search,setSearch]=useState(""),[categoryId,setCategoryId]=useState(""),[incomplete,setIncomplete]=useState(initial),[view,setView]=useState<"grid"|"list">("grid"),[page,setPage]=useState(1); const [selected,setSelected]=useState<Set<number>>(new Set()),',
              '  const [search,setSearch]=useState(""),[categoryId,setCategoryId]=useState(""),[incomplete,setIncomplete]=useState(initial),[view,setView]=useState<"grid"|"list">("grid"),[page,setPage]=useState(1),[activeState,setActiveState]=useState<"yes"|"no">("yes"); const [selected,setSelected]=useState<Set<number>>(new Set()),',
          )
          replace_once(
              "client/src/pages/ProdutosModern.tsx",
              'isActive:"yes",limit:PAGE_SIZE',
              'isActive:activeState,limit:PAGE_SIZE',
          )
          replace_once(
              "client/src/pages/ProdutosModern.tsx",
              '  useEffect(()=>setPage(1),[search,categoryId,incomplete]);',
              '  useEffect(()=>{setPage(1);setSelected(new Set());},[search,categoryId,incomplete,activeState]);',
          )
          replace_once(
              "client/src/pages/ProdutosModern.tsx",
              '{selected.size>0&&<div className="mt-3 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-3">',
              '{selected.size>0&&activeState==="yes"&&<div className="mt-3 flex flex-wrap items-center gap-2 border-t border-slate-100 pt-3">',
          )
          marker = '<button onClick={()=>setSelected(new Set())} className="rounded-xl border border-slate-200 px-3 py-2 text-xs font-bold">Limpar</button></div>}</section>'
          replacement = marker[:-10] + '<BulkProductActions selected={selected} setSelected={setSelected} total={total} filters={{search:search.trim()||undefined,categoryId:categoryId?Number(categoryId):undefined,incomplete:incomplete||undefined,isActive:activeState}} activeState={activeState} onActiveStateChange={setActiveState} categories={categories as any[]} suppliers={suppliers as any[]} onRefresh={refresh} disabled={!!jobId}/></section>'
          replace_once("client/src/pages/ProdutosModern.tsx", marker, replacement)
          PY
          git rm .github/workflows/agent-patch-products-p0.yml
          git config user.name "s2-agent"
          git config user.email "actions@users.noreply.github.com"
          git add server/routers.ts server/routers/productsGroup.ts client/src/pages/ProdutosModern.tsx
          git commit -m "feat(products): conectar operações massivas à tela moderna"
          git push origin HEAD:agent/finalize-products-p0-107
