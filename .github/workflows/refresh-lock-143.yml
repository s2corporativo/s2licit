name: Refresh lockfile PR143

on:
  push:
    branches: [agent/selective-hardening-127]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selective-hardening-127
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolver lockfile sem scripts de terceiros
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commitar lockfile se necessário
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile já consistente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: atualizar lockfile de segurança [skip lock-refresh]"
          git push origin HEAD:agent/selective-hardening-127
