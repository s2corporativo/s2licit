name: Monitor de disponibilidade

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-uptime-monitor
  cancel-in-progress: true

env:
  S2_BASE_URL: ${{ vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}
  S2_VERIFY_OUTPUT: artifacts/uptime/public-verification.json

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar identidade, health e readiness
        id: check
        continue-on-error: true
        run: node scripts/verify-public-s2.mjs

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-diagnostic-${{ github.run_id }}
          path: artifacts/uptime
          if-no-files-found: warn
          retention-days: 7

      - name: Sinalizar falha do runner sem acusar a produção
        if: always() && hashFiles('artifacts/uptime/public-verification.json') == ''
        run: |
          echo "::error::O workflow falhou antes de produzir uma verificação válida. Nenhum incidente de produção foi criado ou alterado."
          echo "### Falha de infraestrutura do monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "O verificador não produziu relatório; a disponibilidade do S2 não foi inferida." >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir, atualizar ou encerrar incidente
        if: always() && hashFiles('artifacts/uptime/public-verification.json') != ''
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
          BASE_URL: ${{ env.S2_BASE_URL }}
          SUMMARY_PATH: ${{ env.S2_VERIFY_OUTPUT }}
        with:
          script: |
            const fs = require("fs");
            const title = "🚨 S2 Licit indisponível — incidente automático";
            const { owner, repo } = context.repo;
            const summary = JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH, "utf8"));
            const checkedAt = new Date().toISOString();
            const baseUrl = process.env.BASE_URL;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const healthy = process.env.OUTCOME === "success" && summary.ok === true;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (!healthy) {
              const diagnostics = (summary.checks || []).map((check) => {
                const attempt = check.attempts?.at(-1) || {};
                return [
                  `#### ${check.name || "verificação"}`,
                  `- URL: ${check.url || "não registrada"}`,
                  `- HTTP: ${attempt.status ?? "sem resposta"}`,
                  `- URL final: ${attempt.finalUrl || "não registrada"}`,
                  `- Erro: ${attempt.error || summary.fatalError || "sem diagnóstico"}`,
                  attempt.bodyPreview ? `- Resposta: \`${String(attempt.bodyPreview).replace(/`/g, "'").slice(0, 500)}\`` : "",
                ].filter(Boolean).join("\n");
              }).join("\n\n");

              const body = [
                "O verificador executou requisições, mas não confirmou a identidade e a prontidão do Sistema S2.",
                "",
                `- URL: ${baseUrl}`,
                `- Última verificação: ${checkedAt}`,
                `- Workflow: ${runUrl}`,
                "",
                "### Critérios obrigatórios",
                "1. `/healthz` deve responder JSON com `status: ok`.",
                "2. `/readyz` deve responder JSON com `status: ready`.",
                "3. `/login` deve conter a identidade HTML do Sistema S2.",
                "4. A URL final deve permanecer no mesmo host configurado.",
                "",
                "### Diagnóstico mais recente",
                diagnostics || `- Erro fatal: ${summary.fatalError || "não identificado"}`,
                "",
                "### Ações imediatas",
                "1. Conferir DNS do subdomínio e o `server_name` do Nginx/Caddy.",
                "2. Verificar `docker compose ps` e `docker compose logs --tail=200 app db`.",
                "3. Confirmar certificado TLS, proxy para a porta local e variável `DOMAIN`.",
                "4. Executar deploy ou rollback somente após identificar o componente incorreto.",
              ].join("\n");

              if (incident) {
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `✅ Recuperação confirmada automaticamente em ${checkedAt}. Identidade, origem, /healthz e /readyz foram validados. Evidência: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Falhar o workflow quando o monitor não concluir com sucesso
        if: steps.check.outcome != 'success'
        run: exit 1
