name: Monitor de disponibilidade

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-uptime-monitor
  cancel-in-progress: true

env:
  S2_BASE_URL: ${{ vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar identidade, health e readiness
        id: check
        shell: bash
        run: |
          set +e
          base="${S2_BASE_URL%/}"
          diagnostic=""
          healthy=true

          check_json_endpoint() {
            endpoint="$1"
            expected_status="$2"
            ok=false
            for attempt in 1 2 3 4; do
              body_file=$(mktemp)
              headers_file=$(mktemp)
              metrics=$(curl -sS --connect-timeout 8 --max-time 15 \
                -H 'User-Agent: S2-Licit-Uptime-Monitor/2.0' \
                -D "$headers_file" -o "$body_file" \
                -w 'HTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}\n' \
                "$base$endpoint" 2>&1)
              code=$?
              body=$(head -c 1000 "$body_file" 2>/dev/null)
              content_type=$(grep -i '^content-type:' "$headers_file" | tail -1 | tr -d '\r' || true)
              diagnostic+=$'\n'"[$endpoint tentativa $attempt]"$'\n'"$metrics"$'\n'"$content_type"$'\n'"BODY:${body}"$'\n'

              if [ "$code" -eq 0 ] && grep -q 'HTTP_STATUS:2' <<<"$metrics"; then
                actual_status=$(BODY="$body" python3 - <<'PY'
          import json, os
          try:
              data = json.loads(os.environ.get("BODY", ""))
              print(data.get("status", ""))
          except Exception:
              print("")
          PY
                )
                if [ "$actual_status" = "$expected_status" ]; then
                  ok=true
                  rm -f "$body_file" "$headers_file"
                  break
                fi
              fi
              rm -f "$body_file" "$headers_file"
              sleep 5
            done
            [ "$ok" = true ] || healthy=false
          }

          check_identity() {
            body_file=$(mktemp)
            metrics=$(curl -sS --connect-timeout 8 --max-time 15 \
              -H 'User-Agent: S2-Licit-Uptime-Monitor/2.0' \
              -o "$body_file" -w 'HTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}\n' \
              "$base/login" 2>&1)
            code=$?
            body=$(head -c 20000 "$body_file" 2>/dev/null)
            diagnostic+=$'\n'"[/login identidade]"$'\n'"$metrics"$'\n'"BODY:${body:0:1000}"$'\n'
            has_root=false
            if grep -Fq 'id="root"' <<<"$body" || grep -Fq "id='root'" <<<"$body"; then
              has_root=true
            fi
            if [ "$code" -ne 0 ] || ! grep -q 'HTTP_STATUS:2' <<<"$metrics" \
              || ! grep -Fq '<title>Sistema S2 — Licitações e Cotações</title>' <<<"$body" \
              || [ "$has_root" != true ]; then
              healthy=false
            fi
            rm -f "$body_file"
          }

          check_json_endpoint /healthz ok
          check_json_endpoint /readyz ready
          check_identity

          {
            echo "healthy=$healthy"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "diagnostic<<EOF"
            printf '%s\n' "$diagnostic"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir, atualizar ou encerrar incidente
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.check.outputs.healthy }}
          CHECKED_AT: ${{ steps.check.outputs.checked_at }}
          DIAGNOSTIC: ${{ steps.check.outputs.diagnostic }}
          BASE_URL: ${{ env.S2_BASE_URL }}
        with:
          script: |
            const title = "🚨 S2 Licit indisponível — incidente automático";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            const healthy = process.env.HEALTHY === "true";
            const checkedAt = process.env.CHECKED_AT;
            const baseUrl = process.env.BASE_URL;
            const diagnostic = (process.env.DIAGNOSTIC || "").slice(0, 12000);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (!healthy) {
              const body = [
                "O monitor não confirmou a identidade e a prontidão do Sistema S2.",
                "",
                `- URL: ${baseUrl}`,
                `- Última verificação: ${checkedAt}`,
                `- Workflow: ${runUrl}`,
                "",
                "### O que foi validado",
                "1. `/healthz` precisa responder JSON com `status: ok`.",
                "2. `/readyz` precisa responder JSON com `status: ready`.",
                "3. `/login` precisa conter a identidade HTML do Sistema S2.",
                "",
                "### Diagnóstico mais recente",
                "```text",
                diagnostic,
                "```",
                "",
                "### Ações imediatas",
                "1. Conferir DNS do subdomínio e o `server_name` do Nginx/Caddy.",
                "2. Verificar `docker compose ps` e `docker compose logs --tail=200 app db`.",
                "3. Confirmar certificado TLS, proxy para a porta local e variável `DOMAIN`.",
                "4. Executar o deploy ou rollback somente após identificar o componente incorreto.",
              ].join("\n");

              if (incident) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              core.setFailed("S2 Licit indisponível, não pronto ou domínio com identidade incorreta");
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `✅ Recuperação confirmada automaticamente em ${checkedAt}. Identidade do S2, /healthz e /readyz foram validados. Evidência: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed",
              });
            }
