name: Monitor de disponibilidade

# AGENDADO PAUSADO em 12/08/2026: runners da conta em limitação GitHub
# (startup_failure em todos os runs desde 10/08). Manter ativo só gera runs
# falsos que nunca executam. Reativar após a limitação ser liberada.
on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-uptime-monitor
  cancel-in-progress: true

env:
  S2_BASE_URL: ${{ vars.S2_BASE_URL }}

jobs:
  uptime:
    # Runner auto-hospedado na VPS Contabo (labels: self-hosted, Linux, X64,
    # s2licit, contabo). Não depende mais dos runners hospedados do GitHub.
    runs-on: [self-hosted, Linux, X64, s2licit, contabo]
    timeout-minutes: 5
    steps:
      - name: Verificar health e readiness
        id: check
        shell: bash
        run: |
          set +e
          base="${S2_BASE_URL%/}"
          diagnostic=""
          healthy=true

          for endpoint in /healthz /readyz; do
            ok=false
            for attempt in 1 2 3 4; do
              response=$(curl -fsS --connect-timeout 8 --max-time 15 \
                -H 'User-Agent: S2-Licit-Uptime-Monitor/1.0' \
                -w '\nHTTP_STATUS:%{http_code}\nTOTAL_TIME:%{time_total}\n' \
                "$base$endpoint" 2>&1)
              code=$?
              diagnostic+=$'\n'"[$endpoint tentativa $attempt]"$'\n'"$response"$'\n'
              if [ "$code" -eq 0 ] && grep -q 'HTTP_STATUS:2' <<<"$response"; then
                ok=true
                break
              fi
              sleep 5
            done
            if [ "$ok" != true ]; then
              healthy=false
            fi
          done

          {
            echo "healthy=$healthy"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "diagnostic<<EOF"
            printf '%s\n' "$diagnostic"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir ou encerrar incidente
        uses: actions/github-script@v7
        env:
          HEALTHY: ${{ steps.check.outputs.healthy }}
          CHECKED_AT: ${{ steps.check.outputs.checked_at }}
          DIAGNOSTIC: ${{ steps.check.outputs.diagnostic }}
          BASE_URL: ${{ env.S2_BASE_URL }}
        with:
          script: |
            const title = "🚨 S2 Licit indisponível — incidente automático";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            const healthy = process.env.HEALTHY === "true";
            const checkedAt = process.env.CHECKED_AT;
            const baseUrl = process.env.BASE_URL;
            const diagnostic = (process.env.DIAGNOSTIC || "").slice(0, 12000);

            if (!healthy) {
              const body = [
                "O monitor automático não conseguiu validar `/healthz` e/ou `/readyz` após quatro tentativas.",
                "",
                `- URL: ${baseUrl}`,
                `- Verificado em: ${checkedAt}`,
                `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                "",
                "### Diagnóstico",
                "```text",
                diagnostic,
                "```",
                "",
                "### Ações imediatas",
                "1. Verificar `docker compose ps` na VPS.",
                "2. Consultar `docker compose logs --tail=200 app db`.",
                "3. Confirmar espaço em disco, memória, banco e migrações.",
                "4. Se necessário, executar o workflow `Rollback VPS`.",
              ].join("\n");

              if (incident) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body: `Nova falha detectada em ${checkedAt}.\n\n${body}`,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              core.setFailed("S2 Licit indisponível ou não pronto");
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `✅ Recuperação confirmada automaticamente em ${checkedAt}. Os endpoints /healthz e /readyz responderam com sucesso.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed",
              });
            }
