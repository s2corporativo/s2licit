name: Refresh lockfile audit fix

on:
  push:
    branches:
      - agent/auditoria-correcao-3-31
    paths:
      - package.json
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auditoria-correcao-3-31
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerar lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile já estava atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'Atualiza lockfile após saneamento de dependências'
          git push origin HEAD:agent/auditoria-correcao-3-31
