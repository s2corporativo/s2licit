name: Smoke de produção

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do S2 Licit"
        required: false
        default: "https://s2.s2corporativo.com.br"
      routes:
        description: "Rotas separadas por vírgula; vazio usa o manifesto completo"
        required: false
        default: ""
      scope:
        description: "critical ou full"
        required: false
        default: "full"
      role:
        description: "Papel exato da conta: user, viewer, editor ou admin"
        required: false
        default: "editor"

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-production-smoke
  cancel-in-progress: true

env:
  SMOKE_BASE_URL: ${{ inputs.base_url || vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}
  SMOKE_ROUTES: ${{ inputs.routes || vars.SMOKE_ROUTES }}
  SMOKE_SCOPE: ${{ inputs.scope || vars.SMOKE_SCOPE || 'full' }}
  SMOKE_ROLE: ${{ inputs.role || vars.SMOKE_ROLE || 'editor' }}
  SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
  SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
  SMOKE_MFA_TOKEN: ${{ secrets.SMOKE_MFA_TOKEN }}
  SMOKE_SCREENSHOT_DIR: artifacts/smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Localizar navegador do runner
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "PUPPETEER_EXECUTABLE_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Navegador: $candidate"
              exit 0
            fi
          done
          echo "Nenhum Chrome/Chromium disponível no runner" >&2
          exit 1

      - name: Executar smoke público e autenticado
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs

      - name: Resumir cobertura executada
        if: always() && hashFiles('artifacts/smoke/summary.json') != ''
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('artifacts/smoke/summary.json', 'utf8'));
          const publicOk = summary.publicVerification?.checks?.filter((check) => check.ok).length ?? 0;
          const lines = [
            '### Smoke de produção',
            '',
            `- URL: ${summary.baseUrl}`,
            `- Verificações públicas aprovadas: ${publicOk}/3`,
            `- Rotas estáticas validadas: ${summary.routes?.filter((route) => !route.route?.includes(':')).length ?? 0}`,
            `- Rotas dinâmicas resolvidas: ${summary.dynamicRoutes?.resolved?.length ?? 0}`,
            `- Rotas dinâmicas sem dados: ${summary.dynamicRoutes?.skipped?.length ?? 0}`,
            `- Rotas dinâmicas não solicitadas: ${summary.dynamicRoutes?.notRequested?.length ?? 0}`,
            `- Escopo: ${summary.scope ?? 'n/d'}`,
            `- Papel configurado/real: ${summary.configuredRole ?? 'n/d'} / ${summary.authentication?.actualRole ?? 'não verificado'}`,
            `- Autenticação: ${summary.authentication?.skipped ? 'não configurada; apenas verificação pública' : 'executada'}`,
            `- Resultado: ${summary.error ? 'falha' : 'sucesso'}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Sinalizar falha do runner sem acusar a produção
        if: always() && hashFiles('artifacts/smoke/summary.json') == ''
        run: |
          echo "::error::O workflow falhou antes de produzir o resumo do smoke. Nenhum incidente de produção será criado ou alterado."
          echo "### Falha de infraestrutura do smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Não houve evidência suficiente para concluir sobre a produção." >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Abrir, atualizar ou encerrar incidente
        if: always() && hashFiles('artifacts/smoke/summary.json') != ''
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          BASE_URL: ${{ env.SMOKE_BASE_URL }}
        with:
          script: |
            const fs = require("fs");
            const title = "🚨 Smoke de produção do S2 Licit falhou";
            const { owner, repo } = context.repo;
            const summary = JSON.parse(fs.readFileSync("artifacts/smoke/summary.json", "utf8"));
            const failed = process.env.OUTCOME !== "success" || Boolean(summary.error);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const checkedAt = new Date().toISOString();
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (failed) {
              const error = String(summary.error || "O smoke retornou falha sem mensagem.")
                .split("\n")
                .slice(0, 10)
                .join("\n");
              const body = [
                "O smoke produziu evidências e identificou falha real na validação do S2.",
                "",
                `- URL: ${process.env.BASE_URL}`,
                `- Verificado em: ${checkedAt}`,
                `- Papel configurado/real: ${summary.configuredRole || "n/d"} / ${summary.authentication?.actualRole || "não identificado"}`,
                `- Rotas validadas antes da falha: ${summary.routes?.length ?? 0}`,
                `- Workflow e evidências: ${runUrl}`,
                "",
                "### Erro",
                "```text",
                error,
                "```",
              ].join("\n");

              if (incident) {
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (!incident) return;

            if (summary.authentication?.skipped) {
              const body = [
                "A origem, identidade, `/healthz` e `/readyz` estão saudáveis, mas o incidente autenticado não pode ser encerrado sem retestar login, papel e rotas.",
                "",
                `- URL: ${process.env.BASE_URL}`,
                `- Verificado em: ${checkedAt}`,
                `- Evidências: ${runUrl}`,
                "",
                "### Pendência objetiva",
                "Cadastrar `SMOKE_USER_EMAIL`, `SMOKE_USER_PASSWORD` e `SMOKE_ROLE` correspondentes à mesma conta.",
              ].join("\n");
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, body });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: incident.number,
              body: `✅ Recuperação confirmada em ${checkedAt}. Origem, login, papel e rotas foram validados. Evidências: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: incident.number,
              state: "closed",
              state_reason: "completed",
            });

      - name: Falhar o workflow quando o smoke falhar
        if: steps.smoke.outcome != 'success'
        run: exit 1
