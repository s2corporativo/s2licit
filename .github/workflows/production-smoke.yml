name: Smoke de produção

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do S2 Licit"
        required: false
        default: "https://s2.s2corporativo.com.br"
      routes:
        description: "Rotas separadas por vírgula; vazio usa o manifesto completo"
        required: false
        default: ""
      scope:
        description: "critical ou full"
        required: false
        default: "full"
      role:
        description: "Papel da conta de teste: user, viewer, editor ou admin"
        required: false
        default: "editor"
  workflow_run:
    workflows: ["Deploy VPS"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-production-smoke
  cancel-in-progress: true

env:
  SMOKE_BASE_URL: ${{ inputs.base_url || vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}
  SMOKE_ROUTES: ${{ inputs.routes || vars.SMOKE_ROUTES }}
  SMOKE_SCOPE: ${{ inputs.scope || vars.SMOKE_SCOPE || 'full' }}
  SMOKE_ROLE: ${{ inputs.role || vars.SMOKE_ROLE || 'editor' }}
  SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
  SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
  SMOKE_MFA_TOKEN: ${{ secrets.SMOKE_MFA_TOKEN }}
  SMOKE_SCREENSHOT_DIR: artifacts/smoke

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Quando disparado pelo deploy, testa exatamente o release implantado.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Localizar navegador do runner
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "PUPPETEER_EXECUTABLE_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Navegador: $candidate"
              exit 0
            fi
          done
          echo "Nenhum Chrome/Chromium disponível no runner" >&2
          exit 1

      - name: Executar smoke público e autenticado
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs

      - name: Resumir cobertura executada
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/smoke/summary.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Smoke sem resumo\n');
            process.exit(0);
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          const lines = [
            '### Smoke de produção',
            '',
            `- URL: ${summary.baseUrl}`,
            `- Endpoints públicos validados: ${summary.endpoints?.length ?? 0}`,
            `- Rotas estáticas validadas: ${summary.routes?.filter((route) => !route.route?.includes(':')).length ?? 0}`,
            `- Rotas dinâmicas resolvidas: ${summary.dynamicRoutes?.resolved?.length ?? 0}`,
            `- Rotas dinâmicas não exercitadas: ${summary.dynamicRoutes?.skipped?.length ?? 0}`,
            `- Escopo/papel: ${summary.scope ?? 'n/d'} / ${summary.role ?? 'n/d'}`,
            `- Autenticação: ${summary.authentication?.skipped ? 'não configurada; smoke público executado' : 'executada'}`,
            `- Resultado: ${summary.error ? 'falha' : 'sucesso'}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Abrir, atualizar ou encerrar incidente
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          BASE_URL: ${{ env.SMOKE_BASE_URL }}
        with:
          script: |
            const fs = require("fs");
            const title = "🚨 Smoke de produção do S2 Licit falhou";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            const failed = process.env.OUTCOME !== "success";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const checkedAt = new Date().toISOString();
            const summaryPath = "artifacts/smoke/summary.json";
            const summary = fs.existsSync(summaryPath)
              ? JSON.parse(fs.readFileSync(summaryPath, "utf8"))
              : {};

            if (failed) {
              const error = String(summary.error || "O workflow não produziu resumo técnico.")
                .split("\n")
                .slice(0, 8)
                .join("\n");
              const body = [
                "O smoke público/autenticado identificou falha real na produção.",
                "",
                `- URL: ${process.env.BASE_URL}`,
                `- Verificado em: ${checkedAt}`,
                `- Endpoints públicos validados: ${summary.endpoints?.length ?? 0}`,
                `- Rotas validadas antes da falha: ${summary.routes?.length ?? 0}`,
                `- Workflow e evidências: ${runUrl}`,
                "",
                "### Erro",
                "```text",
                error,
                "```",
                "",
                "O artefato contém `summary.json` e as capturas concluídas antes da falha.",
              ].join("\n");

              if (incident) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (!incident) return;

            if (summary.authentication?.skipped) {
              const body = [
                "A identidade pública, `/healthz` e `/readyz` estão saudáveis, mas o incidente autenticado não pode ser encerrado sem retestar login, permissões e rotas.",
                "",
                `- URL: ${process.env.BASE_URL}`,
                `- Verificado em: ${checkedAt}`,
                `- Evidências: ${runUrl}`,
                "",
                "### Pendência objetiva",
                "Cadastrar `SMOKE_USER_EMAIL` e `SMOKE_USER_PASSWORD` de uma conta dedicada e executar novamente o workflow.",
              ].join("\n");
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: incident.number,
              body: `✅ Recuperação confirmada em ${checkedAt}. Login, permissões e rotas configuradas foram validados. Evidências: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: incident.number,
              state: "closed",
              state_reason: "completed",
            });

      - name: Falhar o workflow quando o smoke falhar
        if: steps.smoke.outcome != 'success'
        run: exit 1
