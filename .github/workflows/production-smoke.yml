name: Smoke de produção

# AGENDADO PAUSADO em 12/08/2026: runners da conta em limitação GitHub
# (startup_failure em todos os runs desde 10/08). Manter ativo só gera runs
# falsos que nunca executam. Reativar após a limitação ser liberada.
on:
  # schedule:
  #   - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do S2 Licit"
        required: false
        default: "https://s2.s2corporativo.com.br"
      routes:
        description: "Rotas separadas por vírgula; vazio usa o conjunto crítico padrão"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: s2-production-smoke
  cancel-in-progress: true

env:
  SMOKE_BASE_URL: ${{ inputs.base_url || vars.S2_BASE_URL || 'https://s2.s2corporativo.com.br' }}
  SMOKE_ROUTES: ${{ inputs.routes || vars.SMOKE_ROUTES }}
  SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
  SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
  SMOKE_MFA_TOKEN: ${{ secrets.SMOKE_MFA_TOKEN }}
  SMOKE_SCREENSHOT_DIR: artifacts/smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent

      - name: Localizar navegador do runner
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$candidate" ]; then
              echo "PUPPETEER_EXECUTABLE_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Navegador: $candidate"
              exit 0
            fi
          done
          echo "Nenhum Chrome/Chromium disponível no runner" >&2
          exit 1

      - name: Validar secrets obrigatórios
        run: |
          if [ -z "$SMOKE_USER_EMAIL" ] || [ -z "$SMOKE_USER_PASSWORD" ]; then
            echo "::error::Configure SMOKE_USER_EMAIL e SMOKE_USER_PASSWORD com uma conta dedicada de papel editor."
            exit 1
          fi

      - name: Executar smoke autenticado
        id: smoke
        continue-on-error: true
        run: node scripts/production-smoke.mjs

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Abrir, atualizar ou encerrar incidente
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          BASE_URL: ${{ env.SMOKE_BASE_URL }}
        with:
          script: |
            const title = "🚨 Smoke de produção do S2 Licit falhou";
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) => !issue.pull_request && issue.title === title);
            const failed = process.env.OUTCOME !== "success";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const checkedAt = new Date().toISOString();

            if (failed) {
              const body = [
                "O smoke autenticado falhou ao validar a produção.",
                "",
                `- URL: ${process.env.BASE_URL}`,
                `- Verificado em: ${checkedAt}`,
                `- Workflow e evidências: ${runUrl}`,
                "",
                "O artefato do workflow contém `summary.json` e capturas das rotas já validadas.",
                "Verificar login, permissões da conta de smoke, erros do navegador, backend, banco e rotas críticas.",
              ].join("\n");

              if (incident) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: incident.number,
                  body,
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body: `✅ Smoke de produção voltou a passar em ${checkedAt}. Evidências: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed",
              });
            }

      - name: Falhar o workflow quando o smoke falhar
        if: steps.smoke.outcome != 'success'
        run: exit 1
