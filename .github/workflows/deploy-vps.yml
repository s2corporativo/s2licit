name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 13.140.167.153
  DEPLOY_DOMAIN: s2.s2corporativo.com.br

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Auditoria de dependências de produção
        run: pnpm audit --prod --audit-level high

  build-image:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir imagem imutável por SHA
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      S2_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar credenciais de deploy seguro
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_USER:-}" ] || { echo "::error::Configure VPS_DEPLOY_USER."; exit 1; }
          [ "$DEPLOY_USER" != "root" ] || { echo "::error::Deploy remoto como root é proibido."; exit 1; }
          [ -n "${DEPLOY_SSH_KEY:-}" ] || { echo "::error::Configure VPS_SSH_PRIVATE_KEY."; exit 1; }
          [ -n "${VPS_HOST_KEY:-}" ] || { echo "::error::VPS_HOST_KEY é obrigatório; conexão sem pinagem é proibida."; exit 1; }

      - name: Preparar SSH por chave com host pinado
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH_OPTS=-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"

      - name: Testar acesso à VPS
        run: ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "echo 'SSH seguro disponível' && docker --version && docker compose version"

      - name: Sincronizar arquivos de deploy
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/s2licit"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            -e "ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/s2licit/"

      - name: Autenticar imagem na VPS
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

      - name: Migrar e subir aplicação
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          cd /opt/s2licit
          if docker ps -a --format '{{.Names}}' | grep -qx 'sistema-s2-app'; then
            docker rm -f sistema-s2-app >/dev/null
          fi
          DOMAIN='$DEPLOY_DOMAIN' S2_IMAGE='$S2_IMAGE' bash scripts/vps-bootstrap.sh
          REMOTE

      - name: Validar readiness sem expor a aplicação publicamente
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2 || true)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" >/dev/null 2>&1; then
              docker compose ps
              exit 0
            fi
            sleep 4
          done
          docker compose ps >&2 || true
          docker compose logs --tail=120 app db >&2 || true
          exit 1
          REMOTE

      - name: Resumo
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$DEPLOY_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem imutável: $S2_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gate: lint + typecheck + testes + build + audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- SSH: chave + host pinado + usuário não-root" >> "$GITHUB_STEP_SUMMARY"
