# Deploy do S2Licit na VPS Contabo.
# O artefato Docker continua sendo construído no GitHub-hosted runner; a
# publicação ocorre no runner self-hosted instalado na própria VPS, evitando
# senha SSH/root e mantendo o deploy auditável por SHA.
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_DOMAIN: s2.s2corporativo.com.br

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem por SHA
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-image
    runs-on: [self-hosted, Linux, X64, s2licit, contabo]
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      S2_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Checkout da versão a publicar
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validar ambiente da VPS
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          docker --version
          docker compose version
          mkdir -p /opt/s2licit
          test -w /opt/s2licit || { echo "::error::Runner sem permissão de escrita em /opt/s2licit"; exit 1; }

      - name: Sincronizar código localmente
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            ./ /opt/s2licit/

      - name: Autenticar imagem no GHCR
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null

      - name: Migrar e subir aplicação
        run: |
          set -euo pipefail
          cd /opt/s2licit
          if docker ps -a --format '{{.Names}}' | grep -qx 'sistema-s2-app'; then
            echo "Substituindo container anterior sistema-s2-app..."
            docker rm -f sistema-s2-app >/dev/null
          fi
          DOMAIN="$DEPLOY_DOMAIN" S2_IMAGE="$S2_IMAGE" bash scripts/vps-bootstrap.sh

      - name: Validar readiness
        run: |
          set -euo pipefail
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2 || true)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" >/dev/null 2>&1; then
              echo "Aplicação e MySQL prontos"
              docker compose ps
              exit 0
            fi
            sleep 4
          done
          echo "Aplicação não ficou pronta" >&2
          docker compose ps >&2 || true
          docker compose logs --tail=120 app db >&2 || true
          exit 1

      - name: Resumo
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$DEPLOY_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: $S2_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness: aplicação + MySQL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execução: runner self-hosted Contabo (sem SSH externo)" >> "$GITHUB_STEP_SUMMARY"
