# Deploy gratuito do Sistema S2 usando runner próprio na VPS.
# Não usa GitHub-hosted runner, GHCR, cache ou artefatos cobrados.
name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: "IP/host da VPS"
        required: true
        default: "13.140.167.153"
      ssh_user:
        description: "Usuário SSH"
        required: true
        default: "root"
      password:
        description: "Senha SSH (vazio usa o secret VPS_PASSWORD)"
        required: false
        default: ""
      domain:
        description: "Domínio do S2"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ inputs.host || vars.VPS_HOST || '13.140.167.153' }}
  DEPLOY_USER: ${{ inputs.ssh_user || vars.VPS_SSH_USER || 'root' }}
  DEPLOY_DOMAIN: ${{ inputs.domain || vars.VPS_DOMAIN || 's2.s2corporativo.com.br' }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, s2licit-vps]
    timeout-minutes: 60
    steps:
      - name: Checkout do release validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar ferramentas locais gratuitas
        run: |
          set -euo pipefail
          command -v sshpass >/dev/null || { echo "sshpass não instalado no runner" >&2; exit 1; }
          command -v rsync >/dev/null || { echo "rsync não instalado no runner" >&2; exit 1; }
          command -v docker >/dev/null || { echo "Docker não instalado no runner" >&2; exit 1; }

      - name: Preparar conexão SSH
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.password }}" ]; then echo "::add-mask::${{ inputs.password }}"; fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
          else
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
            echo "::warning::VPS_HOST_KEY ausente; cadastre a chave do host para eliminar este aviso."
          fi

      - name: Sincronizar código preservando dados e segredos
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "::error::Configure VPS_PASSWORD ou informe a senha no disparo manual."
            exit 1
          fi
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/s2licit"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude artifacts \
            --exclude uploads \
            --exclude backups \
            -e "sshpass -e ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/s2licit/"

      - name: Criar tag local, migrar e subir containers
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          printf -v Q_DOMAIN '%q' "$DEPLOY_DOMAIN"
          printf -v Q_SHA '%q' "$RELEASE_SHA"
          printf -v Q_ADMIN_EMAIL '%q' "${ADMIN_EMAIL:-}"
          printf -v Q_CERTBOT_EMAIL '%q' "${CERTBOT_EMAIL:-}"
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOMAIN=$Q_DOMAIN RELEASE_SHA=$Q_SHA ADMIN_EMAIL=$Q_ADMIN_EMAIL CERTBOT_EMAIL=$Q_CERTBOT_EMAIL bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          RELEASE_IMAGE="sistema-s2-app:${RELEASE_SHA}"
          RELEASE_IMAGE="$RELEASE_IMAGE" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
          values = {}
          order = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  if key not in values:
                      order.append(key)
                  values[key] = value
          current = values.get('S2_IMAGE', '')
          target = os.environ['RELEASE_IMAGE']
          if current and current != target:
              values['S2_IMAGE_PREVIOUS'] = current
              if 'S2_IMAGE_PREVIOUS' not in order:
                  order.append('S2_IMAGE_PREVIOUS')
          values['S2_IMAGE'] = target
          if 'S2_IMAGE' not in order:
              order.append('S2_IMAGE')
          rendered = []
          emitted = set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0]
                  if key in values and key not in emitted:
                      rendered.append(f'{key}={values[key]}')
                      emitted.add(key)
              else:
                  rendered.append(line)
          for key in order:
              if key not in emitted:
                  rendered.append(f'{key}={values[key]}')
          tmp = path.with_suffix('.env.tmp')
          tmp.write_text('\n'.join(rendered) + '\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PY
          DOMAIN="$DOMAIN" ADMIN_EMAIL="$ADMIN_EMAIL" CERTBOT_EMAIL="$CERTBOT_EMAIL" bash scripts/vps-bootstrap.sh
          REMOTE

      - name: Validar aplicação e MySQL internamente
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            BODY=$(curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" 2>/dev/null || true)
            if BODY="$BODY" python3 - <<'PY'
          import json, os
          try:
              payload = json.loads(os.environ.get('BODY', ''))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if payload.get('status') == 'ready' else 1)
          PY
            then
              echo "Aplicação e MySQL prontos"
              exit 0
            fi
            sleep 4
          done
          docker compose ps >&2 || true
          docker compose logs --tail=100 app db >&2 || true
          exit 1
          REMOTE

      - name: Aplicar integrações cadastradas
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_TLS: ${{ secrets.IMAP_TLS }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL }}
          LLM_TIMEOUT_MS: ${{ vars.LLM_TIMEOUT_MS || secrets.LLM_TIMEOUT_MS }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION || secrets.WHATSAPP_API_VERSION }}
          EMAIL_SYNC_ENABLED: ${{ vars.EMAIL_SYNC_ENABLED || secrets.EMAIL_SYNC_ENABLED }}
          EMAIL_SYNC_CRON: ${{ vars.EMAIL_SYNC_CRON || secrets.EMAIL_SYNC_CRON }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED || secrets.ALERTS_ENABLED }}
          ALERTS_CRON: ${{ vars.ALERTS_CRON || secrets.ALERTS_CRON }}
          SCRAPER_SCHEDULE_ENABLED: ${{ vars.SCRAPER_SCHEDULE_ENABLED || secrets.SCRAPER_SCHEDULE_ENABLED }}
          SCRAPER_SCHEDULE_CRON: ${{ vars.SCRAPER_SCHEDULE_CRON || secrets.SCRAPER_SCHEDULE_CRON }}
        run: |
          set -euo pipefail
          if [ -n "${EMAIL_PASSWORD:-}" ]; then
            [ -n "${EMAIL_USER:-}" ] || { echo "EMAIL_PASSWORD informado sem EMAIL_USER" >&2; exit 1; }
            IMAP_HOST="${IMAP_HOST:-imap.gmail.com}"
            IMAP_PORT="${IMAP_PORT:-993}"
            IMAP_USER="${IMAP_USER:-$EMAIL_USER}"
            IMAP_PASSWORD="${IMAP_PASSWORD:-$EMAIL_PASSWORD}"
            IMAP_TLS="${IMAP_TLS:-true}"
            IMAP_MAILBOX="${IMAP_MAILBOX:-INBOX}"
            SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
            SMTP_PORT="${SMTP_PORT:-587}"
            SMTP_USER="${SMTP_USER:-$EMAIL_USER}"
            SMTP_PASSWORD="${SMTP_PASSWORD:-$EMAIL_PASSWORD}"
            SMTP_SECURE="${SMTP_SECURE:-false}"
            SMTP_FROM="${SMTP_FROM:-$EMAIL_USER}"
          fi

          cat > /tmp/s2-remote-config.sh <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          set_kv_b64() {
            KEY="$1" VALUE_B64="$2" python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = os.environ['KEY']
          value = base64.b64decode(os.environ['VALUE_B64']).decode('utf-8')
          if '\n' in value or '\r' in value:
              raise SystemExit(f'Valor multilinha não permitido para {key}')
          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines() if path.exists() else []
          replacement = f'{key}={value}'
          output, updated = [], False
          for line in lines:
              if line.startswith(f'{key}='):
                  if not updated:
                      output.append(replacement)
                      updated = True
              else:
                  output.append(line)
          if not updated:
              output.append(replacement)
          tmp = path.with_suffix('.env.tmp')
          tmp.write_text('\n'.join(output) + '\n', encoding='utf-8')
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PY
          }
          REMOTE

          applied=0
          append_value() {
            key="$1"
            value="${!key:-}"
            [ -n "$value" ] || return 0
            encoded=$(printf %s "$value" | base64 -w0)
            printf "set_kv_b64 '%s' '%s'\n" "$key" "$encoded" >> /tmp/s2-remote-config.sh
            applied=$((applied + 1))
          }

          for key in \
            ADMIN_PASSWORD GROQ_API_KEY ANTHROPIC_API_KEY \
            BUILT_IN_FORGE_API_URL BUILT_IN_FORGE_API_KEY \
            AI_PROVIDER GROQ_MODEL ANTHROPIC_MODEL LLM_TIMEOUT_MS \
            IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASSWORD IMAP_TLS IMAP_MAILBOX \
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD SMTP_SECURE SMTP_FROM \
            EMAIL_SYNC_ENABLED EMAIL_SYNC_CRON ALERTS_ENABLED ALERTS_CRON \
            SCRAPER_SCHEDULE_ENABLED SCRAPER_SCHEDULE_CRON \
            WHATSAPP_PHONE_ID WHATSAPP_TOKEN WHATSAPP_API_VERSION \
            WHATSAPP_WEBHOOK_URL WHATSAPP_TO; do
            append_value "$key"
          done

          if [ "$applied" -gt 0 ]; then
            cat >> /tmp/s2-remote-config.sh <<'REMOTE'
          docker compose up -d --force-recreate app >/dev/null
          REMOTE
            sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/s2-remote-config.sh
          else
            echo "Nenhuma integração nova; mantendo o .env atual."
          fi
          rm -f /tmp/s2-remote-config.sh

      - name: Validar domínio público e identidade
        env:
          S2_BASE_URL: https://${{ env.DEPLOY_DOMAIN }}
          S2_VERIFY_OUTPUT: artifacts/deploy/public-verification.json
          S2_VERIFY_RETRIES: 6
          S2_VERIFY_DELAY_MS: 10000
        run: node scripts/verify-public-s2.mjs

      - name: Resumo
        if: success()
        run: |
          echo "### Deploy gratuito concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$DEPLOY_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: próprio, sem cobrança de minutos" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: construída localmente na VPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Packages/GHCR: não utilizado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aplicação, MySQL, domínio e identidade validados" >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar evidências locais
        if: always()
        run: rm -rf artifacts/deploy
