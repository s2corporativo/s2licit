# Deploy do Sistema S2 na VPS via SSH.
#
# O workflow preserva o .env da VPS, aplica somente configurações não vazias,
# publica a imagem validada e só conclui quando aplicação, MySQL e domínio
# público respondem com a identidade correta do S2.
name: Deploy VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: "IP/host da VPS"
        required: true
        default: "13.140.167.153"
      ssh_user:
        description: "Usuário SSH"
        required: true
        default: "root"
      password:
        description: "Senha SSH (deixe vazio para usar o secret VPS_PASSWORD)"
        required: false
        default: ""
      domain:
        description: "Domínio do S2. Vazio mantém o valor salvo/variável padrão."
        required: false
        default: ""

env:
  DEPLOY_HOST: ${{ inputs.host || vars.VPS_HOST || '13.140.167.153' }}
  DEPLOY_USER: ${{ inputs.ssh_user || vars.VPS_SSH_USER || 'root' }}
  DEPLOY_DOMAIN: ${{ inputs.domain || vars.VPS_DOMAIN || 's2.s2corporativo.com.br' }}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  build-image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Login no ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag da imagem
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do release validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configurar Node.js para verificação pública
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar ferramentas SSH
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.password }}" ]; then echo "::add-mask::${{ inputs.password }}"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          mkdir -p ~/.ssh
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
            echo "Chave do host fixada."
          else
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
            echo "::warning::VPS_HOST_KEY ausente — conexão SSH sem pinagem da chave do host."
          fi

      - name: Enviar código para a VPS
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SSHPASS" ]; then
            echo "::error::Configure VPS_PASSWORD ou informe a senha no disparo manual."
            exit 1
          fi
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/s2licit"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            -e "sshpass -e ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/s2licit/"

      - name: Instalar, migrar, configurar proxy e subir
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S2_IMAGE: ${{ needs.build-image.outputs.image }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL || secrets.CERTBOT_EMAIL }}
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

          printf -v Q_DOMAIN '%q' "$DEPLOY_DOMAIN"
          printf -v Q_IMAGE '%q' "$S2_IMAGE"
          printf -v Q_ADMIN_EMAIL '%q' "${ADMIN_EMAIL:-}"
          printf -v Q_CERTBOT_EMAIL '%q' "${CERTBOT_EMAIL:-}"
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOMAIN=$Q_DOMAIN S2_IMAGE=$Q_IMAGE ADMIN_EMAIL=$Q_ADMIN_EMAIL CERTBOT_EMAIL=$Q_CERTBOT_EMAIL bash /opt/s2licit/scripts/vps-bootstrap.sh"

      - name: Validar aplicação e MySQL internamente
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            BODY=$(curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" 2>/dev/null || true)
            if BODY="$BODY" python3 - <<'PY'
          import json, os
          try:
              payload = json.loads(os.environ.get("BODY", ""))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if payload.get("status") == "ready" else 1)
          PY
            then
              echo "Aplicação e MySQL prontos ✅"
              exit 0
            fi
            sleep 4
          done
          echo "Aplicação não ficou pronta" >&2
          docker compose ps >&2 || true
          docker compose logs --tail=100 app db >&2 || true
          exit 1
          REMOTE

      # Valores ausentes são ignorados e não apagam o .env existente.
      - name: Aplicar integrações cadastradas no GitHub
        env:
          SSHPASS: ${{ inputs.password || secrets.VPS_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_TLS: ${{ secrets.IMAP_TLS }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || secrets.AI_PROVIDER }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || secrets.ANTHROPIC_MODEL }}
          LLM_TIMEOUT_MS: ${{ vars.LLM_TIMEOUT_MS || secrets.LLM_TIMEOUT_MS }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION || secrets.WHATSAPP_API_VERSION }}
          EMAIL_SYNC_ENABLED: ${{ vars.EMAIL_SYNC_ENABLED || secrets.EMAIL_SYNC_ENABLED }}
          EMAIL_SYNC_CRON: ${{ vars.EMAIL_SYNC_CRON || secrets.EMAIL_SYNC_CRON }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED || secrets.ALERTS_ENABLED }}
          ALERTS_CRON: ${{ vars.ALERTS_CRON || secrets.ALERTS_CRON }}
          SCRAPER_SCHEDULE_ENABLED: ${{ vars.SCRAPER_SCHEDULE_ENABLED || secrets.SCRAPER_SCHEDULE_ENABLED }}
          SCRAPER_SCHEDULE_CRON: ${{ vars.SCRAPER_SCHEDULE_CRON || secrets.SCRAPER_SCHEDULE_CRON }}
        run: |
          set -euo pipefail

          # Compatibilidade controlada com EMAIL_USER/EMAIL_PASSWORD: só é usada
          # quando ambos foram explicitamente cadastrados, sem identidade padrão.
          if [ -n "${EMAIL_PASSWORD:-}" ]; then
            if [ -z "${EMAIL_USER:-}" ]; then
              echo "::error::EMAIL_PASSWORD foi informado sem EMAIL_USER."
              exit 1
            fi
            IMAP_HOST="${IMAP_HOST:-imap.gmail.com}"
            IMAP_PORT="${IMAP_PORT:-993}"
            IMAP_USER="${IMAP_USER:-$EMAIL_USER}"
            IMAP_PASSWORD="${IMAP_PASSWORD:-$EMAIL_PASSWORD}"
            IMAP_TLS="${IMAP_TLS:-true}"
            IMAP_MAILBOX="${IMAP_MAILBOX:-INBOX}"
            SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
            SMTP_PORT="${SMTP_PORT:-587}"
            SMTP_USER="${SMTP_USER:-$EMAIL_USER}"
            SMTP_PASSWORD="${SMTP_PASSWORD:-$EMAIL_PASSWORD}"
            SMTP_SECURE="${SMTP_SECURE:-false}"
            SMTP_FROM="${SMTP_FROM:-$EMAIL_USER}"
          fi

          cat > /tmp/remote-config.sh <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          set_kv_b64() {
            KEY="$1" VALUE_B64="$2" python3 - <<'PY'
          import base64, os
          from pathlib import Path

          key = os.environ["KEY"]
          value = base64.b64decode(os.environ["VALUE_B64"]).decode("utf-8")
          if "\n" in value or "\r" in value:
              raise SystemExit(f"Valor multilinha não permitido para {key}")
          path = Path(".env")
          lines = path.read_text(encoding="utf-8").splitlines() if path.exists() else []
          replacement = f"{key}={value}"
          updated = False
          output = []
          for line in lines:
              if line.startswith(f"{key}="):
                  if not updated:
                      output.append(replacement)
                      updated = True
              else:
                  output.append(line)
          if not updated:
              output.append(replacement)
          tmp = path.with_suffix(".env.tmp")
          tmp.write_text("\n".join(output) + "\n", encoding="utf-8")
          os.chmod(tmp, 0o600)
          os.replace(tmp, path)
          PY
          }
          REMOTE

          applied=0
          append_value() {
            key="$1"
            value="${!key:-}"
            [ -n "$value" ] || return 0
            encoded=$(printf %s "$value" | base64 -w0)
            printf "set_kv_b64 '%s' '%s'\n" "$key" "$encoded" >> /tmp/remote-config.sh
            echo "Configurando ${key}"
            applied=$((applied + 1))
          }

          for key in \
            ADMIN_PASSWORD GROQ_API_KEY ANTHROPIC_API_KEY \
            BUILT_IN_FORGE_API_URL BUILT_IN_FORGE_API_KEY \
            AI_PROVIDER GROQ_MODEL ANTHROPIC_MODEL LLM_TIMEOUT_MS \
            IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASSWORD IMAP_TLS IMAP_MAILBOX \
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD SMTP_SECURE SMTP_FROM \
            EMAIL_SYNC_ENABLED EMAIL_SYNC_CRON ALERTS_ENABLED ALERTS_CRON \
            SCRAPER_SCHEDULE_ENABLED SCRAPER_SCHEDULE_CRON \
            WHATSAPP_PHONE_ID WHATSAPP_TOKEN WHATSAPP_API_VERSION \
            WHATSAPP_WEBHOOK_URL WHATSAPP_TO; do
            append_value "$key"
          done

          if [ "$applied" -eq 0 ]; then
            echo "Nenhuma configuração nova informada; mantendo o .env atual."
            exit 0
          fi

          cat >> /tmp/remote-config.sh <<'REMOTE'
          docker compose up -d --force-recreate app >/dev/null
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            BODY=$(curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" 2>/dev/null || true)
            if BODY="$BODY" python3 - <<'PY'
          import json, os
          try:
              payload = json.loads(os.environ.get("BODY", ""))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if payload.get("status") == "ready" else 1)
          PY
            then
              echo "Integrações aplicadas e aplicação pronta ✅"
              exit 0
            fi
            sleep 4
          done
          echo "Aplicação não ficou pronta após aplicar integrações" >&2
          docker compose logs --tail=100 app >&2 || true
          exit 1
          REMOTE

          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/remote-config.sh

      - name: Validar domínio público e identidade do S2
        env:
          S2_BASE_URL: https://${{ env.DEPLOY_DOMAIN }}
          S2_VERIFY_OUTPUT: artifacts/deploy/public-verification.json
          S2_VERIFY_RETRIES: 6
          S2_VERIFY_DELAY_MS: 10000
        run: node scripts/verify-public-s2.mjs

      - name: Publicar diagnóstico do domínio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-public-verification-${{ github.run_id }}
          path: artifacts/deploy
          if-no-files-found: warn
          retention-days: 14

      - name: Resumo
        if: success()
        run: |
          echo "### Deploy concluído ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$DEPLOY_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Aplicação e MySQL validados internamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- DNS/proxy, /healthz, /readyz e identidade HTML validados externamente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Código, migrações e integrações sincronizados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nenhum valor de secret foi exibido nos logs" >> "$GITHUB_STEP_SUMMARY"
