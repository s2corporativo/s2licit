# Deploy do S2Licit na VPS sem depender do runner self-hosted.
# O build roda no GitHub-hosted runner e a publicação é feita por SSH.
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_HOST: 13.140.167.153
  DEPLOY_USER: root
  DEPLOY_DOMAIN: s2.s2corporativo.com.br

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir imagem por SHA
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      S2_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar SSH
        env:
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSHPASS:-}" ]; then
            echo "::error::Secret VPS_PASSWORD não configurado."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [ -n "${VPS_HOST_KEY:-}" ]; then
            printf '%s\n' "$VPS_HOST_KEY" > "$HOME/.ssh/known_hosts"
            chmod 600 "$HOME/.ssh/known_hosts"
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
          else
            echo "::warning::VPS_HOST_KEY ausente; usando conexão sem pinagem de host nesta execução."
            echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20" >> "$GITHUB_ENV"
          fi

      - name: Testar acesso à VPS
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo 'SSH da VPS disponível' && docker --version && docker compose version"

      - name: Sincronizar código
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/s2licit"
          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            -e "sshpass -e ssh $SSH_OPTS" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/s2licit/"

      - name: Autenticar imagem na VPS
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

      - name: Migrar e subir aplicação
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/s2licit && DOMAIN='$DEPLOY_DOMAIN' S2_IMAGE='$S2_IMAGE' bash scripts/vps-bootstrap.sh"

      - name: Validar readiness
        run: |
          set -euo pipefail
          sshpass -e ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/s2licit
          LOCAL_PORT=$(grep '^APP_LOCAL_PORT=' .env | cut -d= -f2 || true)
          LOCAL_PORT=${LOCAL_PORT:-3000}
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:${LOCAL_PORT}/readyz" >/dev/null 2>&1; then
              echo "Aplicação e MySQL prontos"
              docker compose ps
              exit 0
            fi
            sleep 4
          done
          echo "Aplicação não ficou pronta" >&2
          docker compose ps >&2 || true
          docker compose logs --tail=120 app db >&2 || true
          exit 1
          REMOTE

      - name: Resumo
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$DEPLOY_DOMAIN/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: $S2_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness: aplicação + MySQL" >> "$GITHUB_STEP_SUMMARY"
