name: Agent port products P0 current
on:
  push:
    branches: [agent/finalize-products-p0-107-current]
permissions:
  contents: write
jobs:
  port:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-products-p0-107-current
          fetch-depth: 0
      - name: Portar arquivos validados da P0
        shell: bash
        run: |
          git fetch origin agent/finalize-products-p0-107
          git checkout origin/agent/finalize-products-p0-107 -- \
            client/src/components/products/BulkProductActions.tsx \
            client/src/pages/ProdutosModern.tsx \
            server/db/bulkOperations.test.ts \
            server/db/bulkOperations.ts \
            server/productBulkRbac.test.ts \
            server/routers.ts \
            server/routers/productBulk.ts \
            server/routers/productsGroup.ts \
            server/services/productBulkSelectionService.test.ts \
            server/services/productBulkSelectionService.ts
          git rm .github/workflows/agent-port-products-p0-current.yml
          git config user.name "s2-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(products): finalizar operações massivas sobre main atual"
          git push origin HEAD:agent/finalize-products-p0-107-current
