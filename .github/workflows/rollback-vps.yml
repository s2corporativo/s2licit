# Rollback do Sistema S2 na VPS: volta o app para a imagem anterior
# (registrada pelo deploy em S2_IMAGE_PREVIOUS) ou para uma tag informada.
# Troca só a imagem do app — migrações de banco são forward-only e permanecem.
name: Rollback VPS

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Imagem exata (ghcr.io/org/repo:sha). Vazio = imagem anterior registrada na VPS."
        required: false
        default: ""
      host:
        description: "IP/host da VPS"
        required: false
        default: ""
      password:
        description: "Senha SSH (vazio para usar o secret VPS_PASSWORD)"
        required: false
        default: ""

env:
  DEPLOY_HOST: ${{ inputs.host != '' && inputs.host || vars.VPS_HOST }}
  DEPLOY_USER: ${{ vars.VPS_SSH_USER }}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  rollback:
    # Executa DENTRO da VPS Contabo (runner self-hosted s2-contabo),
    # eliminando a necessidade de SSH externo, sshpass e secrets de senha.
    runs-on: [self-hosted, Linux, X64, s2licit, contabo]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Executar rollback na própria VPS
        run: |
          if [ -n "${{ inputs.password }}" ]; then echo "::add-mask::${{ inputs.password }}"; fi
          if [ ! -x /opt/s2licit/scripts/vps-rollback.sh ]; then
            echo "::error::Script /opt/s2licit/scripts/vps-rollback.sh ausente na VPS."
            exit 1
          fi
          bash /opt/s2licit/scripts/vps-rollback.sh '${{ inputs.image }}'
          echo "### Rollback concluído ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alvo: ${{ inputs.image != '' && inputs.image || 'imagem anterior registrada na VPS (S2_IMAGE_PREVIOUS)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Readiness validada em /readyz" >> "$GITHUB_STEP_SUMMARY"
