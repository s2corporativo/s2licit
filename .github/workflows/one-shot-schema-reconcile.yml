name: one-shot schema reconcile

on:
  push:
    branches:
      - audit/consolidacao-definitiva-20260901

permissions:
  contents: write

jobs:
  reconcile:
    if: "!contains(github.event.head_commit.message, '[schema-fix-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile Drizzle schema with applied migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drizzle/schema.ts')
          s = p.read_text()
          old_qty = 'quantity: int("quantity").default(1).notNull(),'
          new_qty = 'quantity: decimal("quantity", { precision: 15, scale: 4 }).default("1.0000").notNull(),'
          if old_qty not in s:
              raise SystemExit('expected proposal_items quantity declaration not found')
          s = s.replace(old_qty, new_qty, 1)
          old_supplier = '''  name: varchar("name", { length: 256 }).notNull().unique(),\n  isActive: mysqlEnum("isActive", ["yes", "no"]).default("yes").notNull(),'''
          new_supplier = '''  name: varchar("name", { length: 256 }).notNull().unique(),\n  code: varchar("code", { length: 128 }),\n  contact: varchar("contact", { length: 256 }),\n  email: varchar("email", { length: 320 }),\n  phone: varchar("phone", { length: 64 }),\n  notes: text("notes"),\n  isActive: mysqlEnum("isActive", ["yes", "no"]).default("yes").notNull(),'''
          if old_supplier not in s:
              raise SystemExit('expected suppliers declaration not found')
          s = s.replace(old_supplier, new_supplier, 1)
          p.write_text(s)
          PY
          grep -n 'quantity: decimal("quantity"' drizzle/schema.ts
          grep -n 'contact: varchar("contact"' drizzle/schema.ts
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 's2-schema-reconcile[bot]'
          git config user.email 's2-schema-reconcile[bot]@users.noreply.github.com'
          git add drizzle/schema.ts
          git commit -m 'fix(schema): align proposal quantity and supplier contact columns [schema-fix-bot]'
          git push
